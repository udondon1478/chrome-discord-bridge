name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: amd64
            asset: chrome-discord-bridge-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            asset: chrome-discord-bridge-darwin-arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: chrome-discord-bridge-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            asset: chrome-discord-bridge-linux-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset: chrome-discord-bridge-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -o "${{ matrix.asset }}" ./cmd/chrome-discord-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
